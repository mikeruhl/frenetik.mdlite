name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of what went wrong
      placeholder: When I do X, Y happens instead of Z
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug
      placeholder: |
        1. Launch mdlite with `mdlite test.md`
        2. Click on...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened
      placeholder: The file should reload automatically
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: The window froze and showed no content
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mdlite Version
      description: Find version in **Help → About mdlite** or run `mdlite --version`
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which OS are you using?
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Linux (Other)
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      description: Specific OS version (e.g., Windows 11 23H2, macOS 14.2, Ubuntu 22.04)
      placeholder: e.g., Ubuntu 22.04 LTS
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: |
        Paste error messages, stack traces, or attach screenshots.
        For console logs, run mdlite from terminal to capture output.
      placeholder: |
        Paste logs here or drag/drop screenshots
    validations:
      required: false

  - type: textarea
    id: sample
    attributes:
      label: Sample File
      description: |
        If the bug is related to specific markdown content, paste a minimal example here.
        Use code fences with triple backticks.
      placeholder: |
        ```markdown
        # Sample markdown that triggers the bug
        ```
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: |
        Any other context: recent system changes, specific file types, reproducibility (always/sometimes/once)
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I'm using the latest version of mdlite
          required: true
        - label: I can reproduce this bug consistently
          required: false

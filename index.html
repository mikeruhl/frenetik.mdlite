<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdlite</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style id="theme-style"></style>
    <style id="hljs-style"></style>
  </head>
  <body>
    <div id="app-container">
      <nav id="sidebar">
        <div id="sidebar-header">
          <button
            id="sidebar-collapse"
            class="sidebar-collapse-btn"
            type="button"
            title="Hide sidebar (Ctrl+B)"
            aria-label="Hide sidebar"
            aria-expanded="true"
          >
            <svg class="sidebar-icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 2.5v11M14 8H5.5M8.5 4.5 5 8l3.5 3.5" />
            </svg>
          </button>
          <span id="sidebar-title"></span>
        </div>
        <div id="sidebar-tree"></div>
        <section id="interactive-panel" aria-label="Questions" hidden>
          <div id="interactive-header">
            <button
              id="interactive-collapse"
              class="sidebar-collapse-btn"
              type="button"
              title="Hide questions (Ctrl+B)"
              aria-label="Hide questions"
              aria-expanded="true"
            >
              <svg class="sidebar-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2 2.5v11M14 8H5.5M8.5 4.5 5 8l3.5 3.5" />
              </svg>
            </button>
            <span id="interactive-title"></span>
          </div>
          <div id="interactive-questions"></div>
          <div id="interactive-footer">
            <div id="interactive-error" role="alert" hidden></div>
            <div id="interactive-status" aria-live="polite"></div>
            <div id="interactive-actions">
              <button id="interactive-cancel" type="button">Cancel</button>
              <button id="interactive-submit" type="button" title="Submit (Ctrl+Enter or Cmd+Enter)">Submit</button>
            </div>
          </div>
        </section>
      </nav>
      <div
        id="sidebar-divider"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <button
        id="sidebar-expand"
        type="button"
        title="Show sidebar (Ctrl+B)"
        aria-label="Show sidebar"
        aria-expanded="true"
      >
        <svg class="sidebar-icon sidebar-icon-flip" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 2.5v11M14 8H5.5M8.5 4.5 5 8l3.5 3.5" />
        </svg>
      </button>
      <div id="main-content">
        <div id="search-bar" class="search-hidden">
          <input id="search-input" type="text" placeholder="Search..." spellcheck="false" autocomplete="off" />
          <button id="search-regex" class="search-toggle" title="Use regular expression">.*</button>
          <button id="search-case" class="search-toggle" title="Match case">Aa</button>
          <span id="search-count"></span>
          <button id="search-prev" class="search-nav" title="Previous match (Shift+Enter)">&#x25B2;</button>
          <button id="search-next" class="search-nav" title="Next match (Enter)">&#x25BC;</button>
          <button id="search-close" class="search-nav" title="Close (Escape)">&#x2715;</button>
        </div>
        <div id="print-header">
          <span id="print-header-title"></span>
          <span id="print-header-date"></span>
        </div>
        <article id="content"></article>
        <div id="attribution"></div>
        <div id="toast" role="status" aria-live="polite" hidden></div>
      </div>
      <aside id="toc-panel">
        <div id="toc-header">
          <span>Outline</span>
          <button id="toc-close" title="Close outline (Ctrl+Shift+O)" aria-label="Close outline">&#x2715;</button>
        </div>
        <div id="toc-tree"></div>
      </aside>
    </div>
    <div id="about-overlay" class="about-hidden">
      <div id="about-modal" role="dialog" aria-modal="true" aria-labelledby="about-modal-title">
        <div id="about-modal-header">
          <span id="about-modal-title">About mdlite</span>
          <button id="about-close" aria-label="Close">&#x2715;</button>
        </div>
        <div id="about-modal-body">
          <div id="about-version">Version <span id="about-version-number"></span></div>
          <div id="about-tagline">A lightweight markdown previewer</div>
          <hr />
          <div id="about-update-section">
            <button id="about-check-updates">Check for Updates</button>
            <div id="about-update-result"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="link-dialog-overlay" class="link-dialog-hidden">
      <div id="link-dialog" role="dialog" aria-modal="true" aria-labelledby="link-dialog-title">
        <div id="link-dialog-header"><span id="link-dialog-title"></span></div>
        <div id="link-dialog-body">
          <div id="link-dialog-destination" hidden></div>
          <p id="link-dialog-note" hidden></p>
          <p id="link-dialog-warning" hidden></p>
          <label id="link-dialog-trust-row" hidden>
            <input id="link-dialog-trust" type="checkbox" />
            <span id="link-dialog-trust-label"></span>
          </label>
          <input
            id="link-dialog-input"
            type="text"
            aria-label="File extension, such as .log"
            autocomplete="off"
            spellcheck="false"
            hidden
          />
        </div>
        <div id="link-dialog-footer">
          <button id="link-dialog-cancel" type="button">Cancel</button>
          <button id="link-dialog-ok" type="button"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

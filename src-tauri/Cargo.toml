[package]
name = "mdlite"
version = "0.1.0"
description = "A lightweight markdown previewer"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdlite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-cli = "2"
tauri-plugin-opener = "2"
notify = "8"
notify-debouncer-mini = "0.7"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-store = "2"
reqwest = { version = "0.13", features = ["json"] }
semver = "1"

# Pinned to match tauri/wry's webview stack (webview2-com 0.38 / windows 0.61).
# A newer 0.x series here (e.g. webview2-com 0.39 / windows 0.62) pulls a second
# ICoreWebView2 type into the graph and breaks the Windows build.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-implement = "0.60"
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile = "3"


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Down arrow -->
  <g fill="none" stroke="#63b3ed" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="120" x2="256" y2="310"/>
    <polyline points="176,240 256,310 336,240"/>
  </g>

  <!-- Underscore -->
  <line x1="160" y1="380" x2="352" y2="380" stroke="#e2e8f0" stroke-width="32" stroke-linecap="round"/>
</svg>
